name: Setup Neovim
description: Install a pinned Neovim release and put it on PATH.

#
# Installs the Neovim this repository pins, without naming the version.
# It used to be named twice, once in `test.yaml` and once in
# `lint-config.yaml`, each with its own "bump by hand" comment: two pins
# that have to agree and nothing that made them. This action collapsed
# those into one, and `mise.toml` now collapses that one into the same
# place a local checkout reads it from, so CI and a contributor's `PATH`
# cannot disagree either.
#
# Still pinned rather than resolved, to avoid an unauthenticated
# releases-API lookup on every run.
# https://github.com/neovim/neovim/releases
#

inputs:
    version:
        description: >-
            Release to install, without a leading "v", or "nightly" for the
            canary build. Empty means the pin in `mise.toml`, which is what
            lets a matrix leg ask for "whatever this repository pins"
            without naming the version a second time: a matrix always
            passes its input, and an empty string passed to an input
            overrides that input's default rather than falling back to it.
        required: false
        default: ""

runs:
    using: composite

    steps:
        - name: Resolve the release
          id: release
          shell: bash
          run: |
              version='${{ inputs.version }}'
              # The pin lives in `mise.toml`. Bump it there and nowhere
              # else. Read through `$GITHUB_ACTION_PATH` rather than a
              # relative path, since a composite step's cwd is the caller's
              # workspace and not this action's directory.
              if [ -z "$version" ]; then
                  version=$(python3 \
                      "$GITHUB_ACTION_PATH/../../scripts/tool_version.py" \
                      'github:neovim/neovim')
              fi

              if [ "$version" = "nightly" ]; then
                  echo 'tag=nightly' >> "$GITHUB_OUTPUT"
              else
                  echo "tag=v$version" >> "$GITHUB_OUTPUT"
              fi
              echo "version=$version" >> "$GITHUB_OUTPUT"

        # Never cached for nightly: that tag moves daily, so a cache hit
        # would pin the canary to whichever build it first downloaded, which
        # is the opposite of what a canary is for.
        - name: Cache Neovim
          id: cache
          if: steps.release.outputs.version != 'nightly'
          uses: actions/cache@v6
          with:
              path: ${{ runner.temp }}/nvim
              key: nvim-${{ steps.release.outputs.version }}

        - name: Install Neovim
          if: steps.cache.outputs.cache-hit != 'true'
          shell: bash
          run: |
              mkdir -p "$RUNNER_TEMP/nvim"
              curl -sL "https://github.com/neovim/neovim/releases/download/${{ steps.release.outputs.tag }}/nvim-linux-x86_64.tar.gz" | tar xzf - -C "$RUNNER_TEMP/nvim" --strip-components=1

        - name: Add Neovim to PATH
          shell: bash
          run: echo "$RUNNER_TEMP/nvim/bin" >> "$GITHUB_PATH"

        - name: Report the version installed
          shell: bash
          run: nvim --version | head -n 1
