name: Test

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    mini-test:
        name: mini.test (${{ matrix.label }})
        runs-on: ubuntu-latest

        # Several test helpers wait up to 10s for an async result, and a
        # hung Neovim would otherwise sit here for the 6h default.
        timeout-minutes: 10

        # The nightly leg is the canary: this config targets the native
        # `vim.lsp.config` mechanism and other 0.11+ API, so "upstream
        # changed under us" is worth hearing about before it reaches a
        # release, rather than as the apparent fault of whichever pull
        # request happens to run next. It is allowed to fail for that
        # reason, and `fail-fast` is off so a red canary never cancels the
        # leg that counts.
        #
        # The matrix names no Neovim version of its own: the pinned leg
        # takes the release `mise.toml` pins, and nightly is not a version.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: pinned
                      nightly: false
                      required: true
                    - label: nightly
                      nightly: true
                      required: false

        continue-on-error: ${{ !matrix.required }}

        steps:
            # `spell/en.utf-8.spl` is in Git LFS. Without `lfs` the runner
            # checks out the pointer file, and the first case to set
            # 'spell' in a Markdown or commit buffer fails on E757.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  lfs: true

            # Only the pinned leg sets up mise, so on the nightly leg no
            # shim for the pinned Neovim is on PATH to outrank the canary.
            - name: Setup mise
              if: ${{ !matrix.nightly }}
              uses: jdx/mise-action@v4
              with:
                  install_args: github:neovim/neovim

            - name: Setup Neovim nightly
              if: ${{ matrix.nightly }}
              uses: ./.github/actions/setup-neovim-nightly

            - name: Install mini.test
              uses: ./.github/actions/install-mini-test

            # `tests/test_lazy_integration.lua` resolves the spec directory
            # through a real lazy.nvim, so the suite needs one present. It
            # is pinned by `lazy-lock.json`, which is also the cache key, so
            # this costs one shallow fetch per lockfile change rather than
            # one per run.
            - name: Install lazy.nvim
              uses: ./.github/actions/install-lazy

            # `MINITEST_SUMMARY` is appended to, and `$GITHUB_STEP_SUMMARY`
            # is a path GitHub renders as Markdown, so the per-file table
            # lands in the job summary with no third-party action and no
            # extra permission. `MINITEST_REPORT` writes the JUnit XML that
            # the next step attaches. Neither variable changes what runs:
            # `util.test_report.from_env` only adds output.
            # Both named in the shell rather than in `env:`, because
            # `$GITHUB_STEP_SUMMARY` exists only as a runtime variable and
            # has no `${{ }}` context to read it from.
            - name: Run tests
              run: |
                  MINITEST_REPORT="$RUNNER_TEMP/test-results.xml" \
                      MINITEST_SUMMARY="$GITHUB_STEP_SUMMARY" \
                      nvim --headless -u scripts/minimal_init.lua -l scripts/minitest.lua

            # `always()`, because the run that fails is the one whose XML
            # is worth reading, and a failing step would otherwise skip it.
            - name: Upload the test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ matrix.label }}
                  path: ${{ runner.temp }}/test-results.xml
                  if-no-files-found: error
