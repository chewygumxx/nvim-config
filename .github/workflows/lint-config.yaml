#
#
# ~chewygumxx/nvim-config.git
# ::: :/.github/workflows/lint-config.yaml
#
#

name: Lint Config

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    lua:
        name: Lua
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # Pinned rather than resolved, to avoid an unauthenticated
            # releases-API lookup on every run, but read from `mise.toml`
            # rather than restated here: a version named in both places is
            # a version that can disagree with itself, and the one a
            # contributor's `PATH` supplies is the one that matters.
            # Exported into `$GITHUB_ENV` so the cache keys below can key
            # on it.
            - name: Read the tool pins
              run: |
                  python3 .github/scripts/tool_version.py \
                      LUAFMT_VERSION=luafmt \
                      SELENE_VERSION=github:Kampfkarren/selene \
                      >> "$GITHUB_ENV"

            - name: Cache luafmt
              id: cache-luafmt
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}/luafmt
                  key: luafmt-${{ env.LUAFMT_VERSION }}

            - name: Install luafmt
              if: steps.cache-luafmt.outputs.cache-hit != 'true'
              run: |
                  mkdir -p "$RUNNER_TEMP/luafmt"
                  curl -sL "https://github.com/EmmyLuaLs/emmylua-analyzer-rust/releases/download/${LUAFMT_VERSION}/luafmt-linux-x64.tar.gz" | tar xzf - -C "$RUNNER_TEMP/luafmt"
                  chmod +x "$RUNNER_TEMP/luafmt/luafmt"

            - name: Add luafmt to PATH
              run: echo "$RUNNER_TEMP/luafmt" >> "$GITHUB_PATH"

            - name: Cache selene
              id: cache-selene
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}/selene
                  key: selene-${{ env.SELENE_VERSION }}

            # "light" build: no Roblox standard library, unneeded here.
            - name: Install selene
              if: steps.cache-selene.outputs.cache-hit != 'true'
              run: |
                  mkdir -p "$RUNNER_TEMP/selene"
                  curl -sL "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-light-${SELENE_VERSION}-linux.zip" -o "$RUNNER_TEMP/selene/selene.zip"
                  unzip -oq "$RUNNER_TEMP/selene/selene.zip" -d "$RUNNER_TEMP/selene"
                  chmod +x "$RUNNER_TEMP/selene/selene"

            - name: Add selene to PATH
              run: echo "$RUNNER_TEMP/selene" >> "$GITHUB_PATH"

            - name: Check formatting
              run: git ls-files -- '*.lua' ':!**/symlink_*' | xargs -d '\n' luafmt --check --verify

            # selene resolves selene.toml (and the std files it references)
            # from the invocation cwd (repo root) on its own; this assumes a
            # single repo-root selene.toml. If a nested one is ever added,
            # this needs --config again.
            - name: Lint
              run: git ls-files -- '*.lua' ':!**/symlink_*' | xargs -d '\n' selene

    luacats:
        name: LuaCATS
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # As in the `lua` job: pinned, but named only in `mise.toml`.
            # Neovim's pin lives there too and is read by
            # `.github/actions/setup-neovim`, which the test workflow
            # shares. https://github.com/LuaLS/lua-language-server/releases
            - name: Read the tool pins
              run: |
                  python3 .github/scripts/tool_version.py \
                      LUA_LS_VERSION=aqua:LuaLS/lua-language-server \
                      >> "$GITHUB_ENV"

            - name: Setup Neovim
              uses: ./.github/actions/setup-neovim

            # `Check annotation coverage` below runs under
            # `scripts/minimal_init.lua`, which raises when mini.test is
            # absent. That raise does not stop the job: the file is passed
            # as `-u`, so the error is reported during startup and Neovim
            # carries on without ever reaching its `runtimepath`
            # assignment. Run 36223542610 logged exactly that, `E5113 ...
            # mini.test is not installed`, and still reported success, so
            # the gate was running degraded rather than failing. Installing
            # it is what makes that step mean something.
            - name: Install mini.test
              uses: ./.github/actions/install-mini-test

            - name: Cache lua-language-server
              id: cache-lua-ls
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}/lua-language-server
                  key: lua-language-server-${{ env.LUA_LS_VERSION }}

            - name: Install lua-language-server
              if: steps.cache-lua-ls.outputs.cache-hit != 'true'
              run: |
                  mkdir -p "$RUNNER_TEMP/lua-language-server"
                  curl -sL "https://github.com/LuaLS/lua-language-server/releases/download/${LUA_LS_VERSION}/lua-language-server-${LUA_LS_VERSION}-linux-x64.tar.gz" | tar xzf - -C "$RUNNER_TEMP/lua-language-server"
                  chmod +x "$RUNNER_TEMP/lua-language-server/bin/lua-language-server"

            - name: Add lua-language-server to PATH
              run: echo "$RUNNER_TEMP/lua-language-server/bin" >> "$GITHUB_PATH"

            # The same whole-repo check `.husky/pre-commit` runs, repeated
            # here because that hook is skippable (`--no-verify`) and
            # silently no-ops on a machine without lua-language-server.
            # `VIMRUNTIME` has to be exported for the `$VIMRUNTIME/lua`
            # entry in `.luarc.json`'s `workspace.library` to resolve. The
            # exit code is not trusted on its own: some releases report
            # problems and still exit 0, so the summary line is what is
            # actually asserted on.
            - name: Typecheck
              run: |
                  VIMRUNTIME=$(nvim --headless --clean \
                      -c 'lua io.stdout:write(vim.env.VIMRUNTIME or "")' \
                      -c 'qa!' 2>/dev/null)
                  export VIMRUNTIME
                  # `set +e` so a non-zero exit does not abort the step
                  # before its output has been printed
                  set +e
                  out=$(lua-language-server --check=. --checklevel=Warning 2>&1)
                  status=$?
                  set -e
                  printf '%s\n' "$out" | tail -n 60
                  case "$out" in
                      *"no problems found"*) ;;
                      *)
                          echo "::error::lua-language-server found Warnings"
                          exit 1
                          ;;
                  esac
                  exit "$status"

            # Fails if lua-language-server can't infer anything more
            # specific than any/unknown anywhere under lua/, lsp/, or
            # init.lua. See scripts/luals_untyped.lua for how.
            - name: Check annotation coverage
              run: nvim --headless -u scripts/minimal_init.lua -l scripts/luals_untyped.lua

    toml:
        name: TOML
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # As in the `lua` job: pinned, but named only in `mise.toml`.
            # That names the bare version, so the `v` the release tag
            # carries is added at the URL below rather than stored here.
            # https://github.com/tombi-toml/tombi/releases
            - name: Read the tool pins
              run: |
                  python3 .github/scripts/tool_version.py \
                      TOMBI_VERSION=aqua:tombi-toml/tombi \
                      >> "$GITHUB_ENV"

            - name: Cache tombi
              id: cache-tombi
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}/tombi
                  key: tombi-${{ env.TOMBI_VERSION }}

            - name: Install tombi
              if: steps.cache-tombi.outputs.cache-hit != 'true'
              run: |
                  mkdir -p "$RUNNER_TEMP/tombi"
                  curl -sL "https://github.com/tombi-toml/tombi/releases/download/v${TOMBI_VERSION}/tombi-cli-${TOMBI_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xzf - -C "$RUNNER_TEMP/tombi" --strip-components=1
                  chmod +x "$RUNNER_TEMP/tombi/tombi"

            - name: Add tombi to PATH
              run: echo "$RUNNER_TEMP/tombi" >> "$GITHUB_PATH"

            - name: Check Formatting
              run: git ls-files -- '*.toml' ':!**/symlink_*' | xargs -d '\n' tombi format --check --offline

            - name: Lint
              run: git ls-files -- '*.toml' ':!**/symlink_*' | xargs -d '\n' tombi lint --error-on-warnings --offline

    json-yaml:
        name: JSON & YAML
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: NPM Clean Install
              run: npm ci

            - name: Check Formatting
              run: |
                  git ls-files -- '*.json' '*.jsonc' '*.yaml' '*.yml' ':!**/symlink_*' |
                      while IFS= read -r f; do [ -L "$f" ] || printf '%s\n' "$f"; done |
                      xargs -d '\n' npx --no -- prettier --check

    queries:
        name: Queries
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # As in the `lua` job: pinned, but named only in `mise.toml`.
            # https://github.com/ribru17/ts_query_ls/releases
            - name: Read the tool pins
              run: |
                  python3 .github/scripts/tool_version.py \
                      TS_QUERY_LS_VERSION=github:ribru17/ts_query_ls \
                      >> "$GITHUB_ENV"

            - name: Cache ts_query_ls
              id: cache-ts-query-ls
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}/ts_query_ls
                  key: ts_query_ls-${{ env.TS_QUERY_LS_VERSION }}

            # This project's tags carry a leading `v`, unlike the EmmyLua
            # releases the `lua` and `docs` jobs fetch from.
            - name: Install ts_query_ls
              if: steps.cache-ts-query-ls.outputs.cache-hit != 'true'
              run: |
                  mkdir -p "$RUNNER_TEMP/ts_query_ls"
                  curl -sL "https://github.com/ribru17/ts_query_ls/releases/download/v${TS_QUERY_LS_VERSION}/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz" | tar xzf - -C "$RUNNER_TEMP/ts_query_ls"
                  chmod +x "$RUNNER_TEMP/ts_query_ls/ts_query_ls"

            - name: Add ts_query_ls to PATH
              run: echo "$RUNNER_TEMP/ts_query_ls" >> "$GITHUB_PATH"

            # `--check` only, never a write: the committed tree is already
            # the formatter's fixed point, so this asserts it stayed there.
            # `.husky/pre-commit` is what writes, and it needs two passes to
            # get here, which is documented there.
            - name: Check formatting
              run: ts_query_ls format --check queries

            # `lint` and not `check`. `check` is the superset, validating
            # node names and impossible patterns, but it needs the parser
            # objects for each target language and Neovim bundles only seven,
            # so it would silently cover markdown and markdown_inline while
            # skipping norg, norg_meta and comment. `lint` needs no parsers
            # and so reaches all eight files. It is what found five
            # `(#set! conceal "")` patterns here with no capture to attach
            # to, which Tree-sitter had been discarding in silence.
            #
            # Both read `.tsqueryrc.json`. That file is deliberately almost
            # empty: `valid_predicates` replaces the tool's defaults rather
            # than extending them, so declaring this repository's three
            # custom predicates there would make every core `#eq?` an
            # "unrecognized predicate". Predicate parity is already gated,
            # by `tests/test_queries.lua` against `lua/util/treesitter.lua`.
            - name: Lint
              run: ts_query_ls lint queries

    docs:
        name: Docs
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # As in the `lua` job: pinned, but named only in `mise.toml`.
            # The key is the bare alias rather than the backend string,
            # since that is what the `[tools]` table holds, and
            # `tool_version.py` exits non-zero on a key it does not know
            # rather than letting this fall back to whatever the runner
            # happens to have.
            # https://github.com/EmmyLuaLs/emmylua-analyzer-rust/releases
            - name: Read the tool pins
              run: |
                  python3 .github/scripts/tool_version.py \
                      EMMYLUA_DOC_CLI_VERSION=emmylua_doc_cli \
                      >> "$GITHUB_ENV"

            # Neovim is not incidental here. `emmylua_doc_cli` discovers
            # `.luarc.json` on its own, and that file's `workspace.library`
            # names `$VIMRUNTIME/lua`, so the generator has to run as a
            # child of Neovim to resolve it. `scripts/gendoc.lua` says so
            # at more length.
            - name: Setup Neovim
              uses: ./.github/actions/setup-neovim

            # Required for the same reason as in the `luacats` job:
            # `scripts/minimal_init.lua` raises without mini.test, and as a
            # `-u` init that raise does not stop the run.
            - name: Install mini.test
              uses: ./.github/actions/install-mini-test

            - name: Cache emmylua_doc_cli
              id: cache-emmylua-doc-cli
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}/emmylua_doc_cli
                  key: emmylua_doc_cli-${{ env.EMMYLUA_DOC_CLI_VERSION }}

            # The same release the `lua` job takes `luafmt` from, laid out
            # the same way, ie. the bare binary at the archive root. Note
            # this project's tags carry no leading `v`, unlike tombi's.
            - name: Install emmylua_doc_cli
              if: steps.cache-emmylua-doc-cli.outputs.cache-hit != 'true'
              run: |
                  mkdir -p "$RUNNER_TEMP/emmylua_doc_cli"
                  curl -sL "https://github.com/EmmyLuaLs/emmylua-analyzer-rust/releases/download/${EMMYLUA_DOC_CLI_VERSION}/emmylua_doc_cli-linux-x64.tar.gz" | tar xzf - -C "$RUNNER_TEMP/emmylua_doc_cli"
                  chmod +x "$RUNNER_TEMP/emmylua_doc_cli/emmylua_doc_cli"

            - name: Add emmylua_doc_cli to PATH
              run: echo "$RUNNER_TEMP/emmylua_doc_cli" >> "$GITHUB_PATH"

            - name: Regenerate
              run: nvim --headless -u scripts/minimal_init.lua -l scripts/gendoc.lua

            # `git status --porcelain` and not `git diff --exit-code`.
            # Three things can make `docs/` stale and a plain diff sees
            # only one of them: a changed page, yes, but a *new* page is
            # untracked and invisible to it, and a page the generator no
            # longer produces is a deletion that `git add -A` would stage
            # away before the diff ran. `status` reports all three without
            # touching the index. Verified against each case in turn.
            - name: Check docs/ is current
              run: |
                  changed=$(git status --porcelain -- docs/)
                  if [ -n "$changed" ]; then
                      printf '%s\n' "$changed"
                      git diff -- docs/ | head -n 100
                      echo "::error::docs/ is stale; regenerate it with nvim --headless -u scripts/minimal_init.lua -l scripts/gendoc.lua"
                      exit 1
                  fi
